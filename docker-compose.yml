services:
  llama-api:
    build: .
    image: cpu-llm-api-server:local
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      # CloudDabba expects a fixed container port from docker-compose.
      # Keep the application on 8080; the platform proxy maps its public port to this container port.
      PORT: 8080
      MODEL_DIR: ${MODEL_DIR:-/models}
      DOWNLOAD_MODEL: ${DOWNLOAD_MODEL:-true}
      ENABLE_WEBUI: ${ENABLE_WEBUI:-true}
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "PORT=8080 /app/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
